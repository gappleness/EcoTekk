<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecotekk — profile</title>
    <link rel="stylesheet" href="stylesheet.css">
    <script src="theme.js"></script>
    <script src="auth.js"></script>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">ecotekk</a>
        <ul>
            <li><a href="home.html">Find drop-off</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li id="nav-pts"></li>
            <li><button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button></li>
        </ul>
    </nav>

    <div class="profile-wrap" id="profileRoot">
        <!-- filled if logged in -->
    </div>

    <script>
        (function () {
            var user = EcotekkAuth.currentUser();
            var root = document.getElementById('profileRoot');

            if (!user) {
                root.innerHTML =
                    '<h1 style="font-size:28px;margin:0 0 12px;">Profile</h1>' +
                    '<p class="empty-note">You need to sign in to see points and rewards.</p>' +
                    '<div class="profile-actions"><a class="getStarted" href="login.html" style="margin-top:16px;">Login / Sign up</a></div>';
                return;
            }

            var points = EcotekkAuth.getPoints(user.name);
            var history = EcotekkAuth.getHistory(user.name);
            var rewards = EcotekkAuth.REWARDS;

            document.getElementById('nav-pts').innerHTML =
                '<span class="nav-points">' + points + ' pts</span>';

            function render() {
                points = EcotekkAuth.getPoints(user.name);
                history = EcotekkAuth.getHistory(user.name);

                var rewardsHtml = rewards.map(function (r) {
                    var can = points >= r.cost;
                    return (
                        '<div class="reward-card">' +
                        '<h3>' + r.name + '</h3>' +
                        '<p>' + r.desc + '</p>' +
                        '<div class="cost">' + r.cost + ' pts</div>' +
                        '<button type="button" data-reward="' + r.id + '"' + (can ? '' : ' disabled') + '>' +
                        (can ? 'Redeem' : 'Need more points') +
                        '</button></div>'
                    );
                }).join('');

                var histHtml = history.length
                    ? history.map(function (h) {
                        var d = new Date(h.at);
                        var dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                        var cls = h.points >= 0 ? 'pos' : 'neg';
                        var sign = h.points >= 0 ? '+' : '';
                        return (
                            '<li>' +
                            '<span class="hist-label">' + (h.type === 'disposal' ? 'Disposed at ' : 'Redeemed ') + h.label + '</span>' +
                            '<span class="hist-pts ' + cls + '">' + sign + h.points + '</span>' +
                            '<span class="hist-date">' + dateStr + '</span>' +
                            '</li>'
                        );
                    }).join('')
                    : '<p class="empty-note">No activity yet. Locate a drop-off and log a disposal to earn points.</p>';

                root.innerHTML =
                    '<div class="profile-header">' +
                    '<div><h1>Hi, ' + user.name + '</h1>' +
                    (user.email ? '<p class="empty-note">' + user.email + '</p>' : '') +
                    '</div>' +
                    '<div class="points-badge"><div class="label">Points balance</div><div class="value" id="ptsValue">' + points + '</div></div>' +
                    '</div>' +

                    '<h2 class="section-title">Redeem rewards</h2>' +
                    '<div class="rewards-grid" id="rewardsGrid">' + rewardsHtml + '</div>' +

                    '<h2 class="section-title">Activity</h2>' +
                    '<ul class="history-list" id="histList">' + histHtml + '</ul>' +

                    '<div class="profile-actions">' +
                    '<a href="home.html" class="btn-outline">Find drop-off</a>' +
                    '<button type="button" class="btn-outline" id="logoutBtn">Log out</button>' +
                    '</div>';

                document.getElementById('nav-pts').innerHTML =
                    '<span class="nav-points">' + points + ' pts</span>';

                document.getElementById('logoutBtn').addEventListener('click', function () {
                    EcotekkAuth.logout();
                    window.location.href = 'index.html';
                });

                document.getElementById('rewardsGrid').addEventListener('click', function (e) {
                    var btn = e.target.closest('button[data-reward]');
                    if (!btn || btn.disabled) return;
                    var id = btn.getAttribute('data-reward');
                    var result = EcotekkAuth.redeem(user.name, id);
                    if (!result.ok) {
                        alert(result.error);
                        return;
                    }
                    alert('Redeemed: ' + result.reward.name + '. Remaining: ' + result.remaining + ' pts.');
                    render();
                });
            }

            render();
        })();
    </script>
</body>
</html>
