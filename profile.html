<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecotekk — profile</title>
    <link rel="stylesheet" href="stylesheet.css">
    <script src="theme.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">ecotekk</a>
        <ul>
            <li><a href="home.html">Find drop-off</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li id="nav-pts"></li>
            <li><button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button></li>
        </ul>
    </nav>

    <div class="profile-wrap" id="profileRoot">
        <!-- filled if logged in -->
    </div>

    <script>
    EcotekkAuth.ready.then(function(){
      const root=document.getElementById('profileRoot'),u=EcotekkAuth.currentUser();
      if(!u){root.innerHTML='<h1>Profile</h1><p>Please sign in to see your account.</p><a class="getStarted" href="login.html">Login / Sign up</a>';return;}
      const h=document.createElement('h1');h.textContent='Hi, '+u.name;
      const mail=document.createElement('p');mail.textContent=u.email || '';
      const verification=document.createElement('p');verification.textContent=u.emailVerified?'Email verified':'Email not yet verified (check your inbox if you registered by email).';
      const info=document.createElement('p');info.textContent='Your profile is stored in Firebase. Points, disposal awards and redemptions are paused until secure verification is implemented.';
      const status=document.createElement('p');status.textContent='Loading cloud profile…';
      const logout=document.createElement('button');logout.className='btn-outline';logout.textContent='Log out';logout.onclick=async()=>{await EcotekkAuth.logout();location.href='index.html';};
      root.replaceChildren(h,mail,verification,info,status,logout);
      try{EcotekkAuth.watchProfile(p=>{status.textContent=p?'Cloud profile: '+p.name:'Cloud profile is being created.';});}catch(e){status.textContent=e.message;}
    });
    </script>
</body>
</html>
